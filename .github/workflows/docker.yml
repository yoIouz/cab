name: Multi-module CI/CD

on:
  push:
    branches: [ master ]

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  TESTCONTAINERS_RYUK_DISABLED: "true"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

jobs:
  registry-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and retag db image
        run: |
          docker pull $IMAGE_PREFIX/cab_db:latest
          docker tag $IMAGE_PREFIX/cab_db:latest cab_db:latest

  test-modules:
    needs: registry-setup
    runs-on: ubuntu-latest

    strategy:
      matrix:
        module: ["passenger-service"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 19
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            **/target
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Install dependencies for all modules
        run: mvn clean install -DskipTests

      - name: Set DB env
        run: echo "DATABASE_URL=jdbc:postgresql://localhost:5432/test" >> $GITHUB_ENV

      - name: Run tests for ${{ matrix.module }}
        run: mvn clean test -pl passenger-service -Dspring.datasource.url=$DATABASE_URL

  push:
    needs: test-modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "passenger-service" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build ${{ matrix.service }}
        run: |
          docker build \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            -t $IMAGE_PREFIX/${{ matrix.service }}:latest \
            -f ./Dockerfile .
      - name: Push ${{ matrix.service }}
        run: |
          docker push ${{ env.REGISTRY_URL }}/${{ matrix.service }}:latest