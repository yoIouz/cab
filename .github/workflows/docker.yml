name: Github CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY_URL: "localhost:5000"
  SERVICE_NAME: "passenger-service"
  IMAGE_TAG: "latest"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '19'
        distribution: 'temurin'
    
    - name: Run tests
      run: ./mvnw test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build and push
      env:
        # Динамический тег для коммитов
        COMMIT_TAG: ${{ github.sha }}
      run: |
        docker build \
          --build-arg SERVICE_NAME=${{ env.SERVICE_NAME }} \
          -t ${{ env.REGISTRY_URL }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }} \
          -t ${{ env.REGISTRY_URL }}/${{ env.SERVICE_NAME }}:${{ env.COMMIT_TAG }} \
          .
        
        docker push ${{ env.REGISTRY_URL }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }}
        docker push ${{ env.REGISTRY_URL }}/${{ env.SERVICE_NAME }}:${{ env.COMMIT_TAG }}
    
    - name: Print success
      run: |
        echo "Successfully built and pushed:"
        echo "${{ env.REGISTRY_URL }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }}"
        echo "${{ env.REGISTRY_URL }}/${{ env.SERVICE_NAME }}:${{ env.COMMIT_TAG }}"
