name: Multi-module CI/CD

on:
  push:
    branches: [ master ]

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  TESTCONTAINERS_RYUK_DISABLED: "true"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

jobs:
  rename-repo:
    runs-on: ubuntu-latest
    outputs:
      image-prefix: ${{ steps.set-prefix.outputs.image-prefix }}
    steps:
      - name: Set lowercase IMAGE_PREFIX
        id: set-prefix
        run: |
          echo "image-prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

  test-modules:
    needs: rename-repo
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ["passenger-service"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 19
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            **/target
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Install dependencies for all modules
        run: mvn clean install -DskipTests

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and retag db image
        run: |
          docker pull ${{ needs.rename-repo.outputs.image-prefix }}/cab_db:latest
          docker tag ${{ needs.rename-repo.outputs.image-prefix }}/cab_db:latest cab_db:latest

      - name: Run tests for ${{ matrix.module }}
        run: mvn clean test -pl ${{ matrix.module }} -Dspring.datasource.url=$DATABASE_URL

  push:
    needs: [test-modules, rename-repo]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "passenger-service" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build ${{ matrix.service }}
        run: |
          docker build \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            -t ${{ needs.rename-repo.outputs.image-prefix }}/${{ matrix.service }}:latest \
            -f ./Dockerfile .
      - name: Push ${{ matrix.service }}
        run: |
          docker push ${{ env.REGISTRY_URL }}/${{ matrix.service }}:latest