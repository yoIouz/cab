name: Multi-module CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  TESTCONTAINERS_RYUK_DISABLED: "true"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

jobs:
  rename-repo:
    runs-on: ubuntu-latest
    outputs:
      image-prefix: ${{ steps.set-prefix.outputs.image-prefix }}
    steps:
      - name: Set lowercase IMAGE_PREFIX
        id: set-prefix
        run: |
          echo "image-prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

  determine-changes:
    runs-on: ubuntu-latest
    outputs:
      services-to-build: ${{ steps.services-to-build.outputs.services }}

    steps:
      - uses: actions/checkout@v4

      - name: Get changed services
        id: services-to-build
        run: |
          git fetch --prune --unshallow
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          SERVICES=""

          for service in passenger-service booking-service common driver-service payment-service cloud-config-server eureka-server api-gateway; do
          if echo "$CHANGED_FILES" | grep -q "$service/"; then
          SERVICES="$SERVICES $service"
          fi
          done

          SERVICES=$(echo "$SERVICES" | xargs)  # trim
          echo "Detected changes: $SERVICES"

          if [ -z "$SERVICES" ]; then
          echo "services=none" >> $GITHUB_OUTPUT
          else
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          fi

  test-modules:
    needs: [rename-repo, determine-changes]
    if: needs.determine-changes.outputs.services != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 19
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            **/target
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Install dependencies for all modules
        run: mvn clean install -DskipTests

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and retag db image
        run: |
          docker pull ${{ needs.rename-repo.outputs.image-prefix }}/cab_db:latest
          docker tag ${{ needs.rename-repo.outputs.image-prefix }}/cab_db:latest cab_db:latest

      - name: Run tests
        run: |
          SERVICES="${{ needs.determine-changes.outputs.services }}"
          for SERVICE in $SERVICES; do
            echo "🔍 Testing $SERVICE..."
            mvn test -pl $SERVICE -Dspring.datasource.url=$DATABASE_URL
          done

  push:
    needs: [test-modules, rename-repo, determine-changes]
    if: needs.determine-changes.outputs.services != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        run: |
          SERVICES="${{ needs.determine-changes.outputs.services }}"
          for SERVICE in $SERVICES; do
            echo "🐳 Building and pushing $SERVICE..."  
            docker build \
              --build-arg SERVICE_NAME=$SERVICE \
              -t ${{ needs.rename-repo.outputs.image-prefix }}/$SERVICE:latest \
              -f Dockerfile .
            docker push ${{ needs.rename-repo.outputs.image-prefix }}/$SERVICE:latest
          done