apiVersion: v1
kind: Service
metadata:
  name: cloud-config
spec:
  selector:
    app: cab
  ports:
    - name: cloud-config-server
      port: 8080
      targetPort: 8888
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: cloud-config
                port:
                  number: 8080
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-db
                port:
                  number: 5432