name: Multi-module CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  TESTCONTAINERS_RYUK_DISABLED: "true"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

jobs:
  rename-repo:
    runs-on: ubuntu-latest
    outputs:
      image-prefix: ${{ steps.set-prefix.outputs.image-prefix }}
    steps:
      - name: Set lowercase IMAGE_PREFIX
        id: set-prefix
        run: |
          echo "image-prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

  determine-changes:
    runs-on: ubuntu-latest
    outputs:
      services-to-build: ${{ steps.services-to-build.outputs.services }}

    steps:
      - uses: actions/checkout@v4

      - name: Get changed services
        id: services-to-build
        run: |
          # Получаем список изменённых файлов с момента последнего коммита
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})

          # Инициализируем строку для сервисов
          SERVICES=""

          # Проверяем, какие сервисы были изменены
          if echo "$CHANGED_FILES" | grep -q "passenger-service/"; then
            SERVICES="passenger-service"
          fi
          if echo "$CHANGED_FILES" | grep -q "booking-service/"; then
            SERVICES="$SERVICES booking-service"
          fi
          if echo "$CHANGED_FILES" | grep -q "common/"; then
            SERVICES="$SERVICES common"
          fi
          if echo "$CHANGED_FILES" | grep -q "driver-service/"; then
            SERVICES="$SERVICES driver-service"
          fi
          if echo "$CHANGED_FILES" | grep -q "payment-service/"; then
            SERVICES="$SERVICES payment-service"
          fi
          if echo "$CHANGED_FILES" | grep -q "cloud-config-server/"; then
            SERVICES="$SERVICES cloud-config-server"
          fi
          if echo "$CHANGED_FILES" | grep -q "eureka-server/"; then
            SERVICES="$SERVICES eureka-server"
          fi
          if echo "$CHANGED_FILES" | grep -q "api-gateway/"; then
            SERVICES="$SERVICES api-gateway"
          fi

          # Передаем результат как output для использования в следующем шаге
          echo "::set-output name=services::${SERVICES}"

  test-modules:
    needs: [rename-repo, determine-changes]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJson(needs.determine-changes.outputs.services) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 19
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            **/target
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Install dependencies for all modules
        run: mvn clean install -DskipTests

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and retag db image
        run: |
          docker pull ${{ needs.rename-repo.outputs.image-prefix }}/cab_db:latest
          docker tag ${{ needs.rename-repo.outputs.image-prefix }}/cab_db:latest cab_db:latest

      - name: Run tests for ${{ matrix.module }}
        run: mvn clean test -pl ${{ matrix.module }} -Dspring.datasource.url=$DATABASE_URL

  push:
    needs: [test-modules, rename-repo]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.determine-changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build ${{ matrix.service }}
        run: |
          docker build \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            -t ${{ needs.rename-repo.outputs.image-prefix }}/${{ matrix.service }}:latest \
            -f ./${{ matrix.service }}/Dockerfile .
          
      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push ${{ matrix.service }}
        run: |
          docker push ${{ needs.rename-repo.outputs.image-prefix }}/${{ matrix.service }}:latest
