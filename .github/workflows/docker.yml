name: Multi-module CI/CD

on:
  push:
    branches: [ master ]

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  TESTCONTAINERS_RYUK_DISABLED: "true"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

jobs:
  registry-login:
    runs-on: ubuntu-latest

    steps:
      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  test-modules:
    needs: registry-login
    runs-on: ubuntu-latest

    strategy:
      matrix:
        module: ["passenger-service"]
      fail-fast: false

    services:
      postgres:
        image: repo/cab_db:latest
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 19
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            **/target
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Install dependencies for all modules
        run: mvn clean install -DskipTests

      - name: Set DB env
        run: echo "DATABASE_URL=jdbc:postgresql://localhost:5432/test" >> $GITHUB_ENV

      - name: Run tests for ${{ matrix.module }}
        run: mvn clean test -pl passenger-service -Dspring.datasource.url=$DATABASE_URL