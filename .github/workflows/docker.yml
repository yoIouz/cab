name: Multi-module CI/CD

on:
  push:
    branches: [ master ]

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  TESTCONTAINERS_RYUK_DISABLED: "true"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

jobs:
  build-common:
    runs-on: ubuntu-latest
    outputs:
      common-version: ${{ steps.get-version.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: 19
        distribution: temurin

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.m2/repository
          **/target
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

    - name: Build common module
      working-directory: ./common
      run: mvn clean compile -DskipTests

    - name: Get common version
      id: get-version
      working-directory: ./common
      run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

  test-modules:
    needs: build-common
    runs-on: ubuntu-latest

    strategy:
      matrix:
        module: [ "passenger-service" ]
      fail-fast: false

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 19
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            **/target
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Install common module
        run: mvn install -DskipTests

      - name: Set DB env
        run: echo "DATABASE_URL=jdbc:postgresql://localhost:5432/test" >> $GITHUB_ENV

      - name: Run tests for ${{ matrix.module }}
        working-directory: ./${{ matrix.module }}
        run: mvn test -Dspring.datasource.url=$DATABASE_URL

  build-and-push:
    needs: test-modules
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: ["passenger-service"]
    steps:
    - uses: actions/checkout@v4

    - name: Extract image tag
      id: get-tag
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "tag=latest" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push ${{ matrix.service }}
      run: |
        IMAGE_NAME=${{ env.GHCR_IMAGE_PREFIX }}-${{ matrix.service }}
        IMAGE_TAG=${{ steps.get-tag.outputs.tag }}

        docker build \
          -t $IMAGE_NAME:$IMAGE_TAG \
          -f ./${{ matrix.service }}/Dockerfile .

        docker push $IMAGE_NAME:$IMAGE_TAG
