spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/test
  datasource:
    url: jdbc:postgresql://localhost:5432/account
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  cloud:
    config:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: false

eureka:
  client:
    enabled: false